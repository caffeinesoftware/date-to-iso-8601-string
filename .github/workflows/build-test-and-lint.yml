name: Build, test and lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3.4.1
        with:
          node-version: 16.x
          cache: 'npm'
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: ./fetch-iata-data.sh
        env:
          IATA_CODE_DECODER_API_BASE_URL: ${{ secrets.IATA_CODE_DECODER_API_BASE_URL }}
          IATA_CODE_DECODER_API_PATH: ${{ secrets.IATA_CODE_DECODER_API_PATH }}
